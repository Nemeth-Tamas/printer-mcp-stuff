<!doctype html>
<html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cellnet Booking</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color-scheme:dark;background:#0b1220;color:#f0f5ff}
*{box-sizing:border-box}body{max-width:1250px;margin:0 auto;padding:32px 26px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:700;color:#8da9c9}
h1{font-size:clamp(30px,4vw,42px);letter-spacing:-.05em;margin:6px 0}
h2{font-size:19px;letter-spacing:-.02em;margin:0 0 22px}
p{color:#a0b3ce}a{color:#b1cfff;text-decoration:none;border:1px solid #364a68;background:#1c2e48;border-radius:10px;padding:11px 15px}
main{display:grid;grid-template-columns:minmax(340px,420px) minmax(0,1fr);gap:20px}
section{border:1px solid #2c3e58;background:#17253a;border-radius:18px;padding:25px;min-height:440px}
label{display:block;margin:16px 0 6px;color:#c1d0e5;font-size:13px;font-weight:600}
input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #3e5371;border-radius:10px;background:#101d31;color:#f0f5ff;font:inherit;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#73a5ff;box-shadow:0 0 0 3px #73a5ff28}
button{background:#4b87ec;border:0;color:#fff;border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:650;margin:8px 7px 4px 0}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.5}
.danger{background:#8e3445}.ghost{background:#293d5a}
article{background:#1d3049;border:1px solid #324765;border-radius:12px;padding:16px;margin:12px 0}
article strong{font-size:15px}article p{margin:9px 0;color:#afbfda;font-size:13px}small{color:#91a6c5;display:block;white-space:pre-wrap}
#notice{min-height:28px;color:#8fdaae;font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.filters button{margin:0}.filters button.active{background:#4b87ec}#search{margin-bottom:14px}#suggestions{display:grid;gap:5px;margin-top:5px}#suggestions button{text-align:left;background:#263e5c;margin:0}
@media(max-width:850px){main{grid-template-columns:1fr}body{padding:18px}}
</style></head>
<body><header><div><div class="eyebrow">CELLNET / ÜGYFÉLKEZELÉS</div><h1>Időpontfoglalás</h1><p>Egyszerű foglalás, Google Calendar szinkron és nyomtatás.</p></div><a href="/calendar">Heti naptár →</a></header>
<main><section><h2 id="formtitle">Új foglalás</h2><p id="editinfo" hidden>Foglalás szerkesztése</p><form id="form">
<label>Ügyfél neve <input name="customer" required maxlength="120"></label>
<div id="suggestions"></div><label>Telefonszám <input name="phone" required maxlength="40"></label>
<label>Szolgáltatás <select name="service"><option>Bevizsgálás</option><option>Telefonjavítás</option><option>Laptop / PC szerviz</option><option>Konzultáció</option><option>Helyszíni kiszállás</option></select></label>
<label>Időpont <input name="starts_at" type="datetime-local" required></label>
<label>Időtartam (perc) <input name="duration_minutes" type="number" value="60" min="15" max="480"></label>
<label>Megjegyzés <textarea name="notes" rows="3" maxlength="1500"></textarea></label>
<label style="display:flex;align-items:center;gap:10px"><input type="checkbox" name="sms_enabled" style="width:auto">SMS visszaigazolás és 24 órás emlékeztető</label>
<button id="save" type="submit">Időpont mentése</button><button id="clear" type="button" class="ghost" hidden>Mégse</button></form></section>
<section><h2>Foglalások</h2><div class="filters"><button type="button" data-view="upcoming" class="active">Közelgő</button><button type="button" data-view="past">Korábbi</button><button type="button" data-view="cancelled">Lemondott</button><button type="button" data-view="all">Összes</button></div><input id="search" placeholder="Keresés: név, telefon, szolgáltatás…" aria-label="Foglalások keresése"><button class="ghost" id="refresh">Frissítés</button><button class="ghost" id="printerCheck">Nyomtató ellenőrzése</button><div id="notice" role="status"></div><div id="appointments"></div></section></main>
<script>
let editing=null,view="upcoming";const $=id=>document.getElementById(id);const slot=new URLSearchParams(location.search).get('slot');if(slot)document.querySelector('[name=starts_at]').value=slot;
async function api(path,method='GET',body){
 const res=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 if(!res.ok)throw Error('HTTP '+res.status+' — '+(await res.text()).slice(0,130));
 return res.json();
}
function message(s){$('notice').textContent=s}
async function refresh(){
 try{const rows=await api('/api/appointments?view='+encodeURIComponent(view)+'&search='+encodeURIComponent($('search').value));const out=$('appointments');out.replaceChildren();if(!rows.length){const empty=document.createElement('p');empty.textContent='Ebben a nézetben nincs foglalás.';out.append(empty)}
 for(const r of rows){
 const a=document.createElement('article');const h=document.createElement('strong');h.textContent=r.customer+' — '+r.service;
 const p=document.createElement('p');p.textContent=new Date(r.starts_at).toLocaleString('hu-HU',{timeZone:'Europe/Budapest'})+' · '+r.phone+' · '+r.status;
 const detail=document.createElement('small');detail.textContent=r.notes;
 const print=document.createElement('button');print.textContent='Ügyfél példány';print.onclick=()=>api('/api/appointments/'+r.id+'/print?mode=customer','POST').then(()=>message('Ügyfél példány sorba állítva')).catch(e=>message(e.message));
 const tech=document.createElement('button');tech.textContent='Technikus példány';tech.className='ghost';tech.onclick=()=>api('/api/appointments/'+r.id+'/print?mode=technician','POST').then(()=>message('Technikus példány sorba állítva')).catch(e=>message(e.message));
 const sms=document.createElement('button');sms.textContent='SMS küldése most';sms.className='ghost';sms.disabled=r.status!=='booked'||!r.sms_enabled;
 sms.onclick=async()=>{if(!confirm('Elküldjük most a foglalási visszaigazolást SMS-ben?'))return;
   sms.disabled=true;try{const result=await api('/api/appointments/'+r.id+'/sms/send','POST');message('SMS sorba állítva (#'+result.sms_id+'). A küldés állapota az SMS előzményekben ellenőrizhető.')}catch(e){message(e.message)}finally{sms.disabled=false}};
 const repeat=document.createElement('button');repeat.textContent='Új foglalás ugyanennek';repeat.className='ghost';
 repeat.onclick=()=>{editing=null;$('clear').click();$('form').elements.customer.value=r.customer;$('form').elements.phone.value=r.phone;$('form').elements.service.value=r.service;$('formtitle').textContent='Visszatérő ügyfél – új foglalás';$('form').scrollIntoView({behavior:'smooth'});};
 const edit=document.createElement('button');edit.textContent='Szerkesztés';edit.className='ghost';edit.disabled=r.status==='cancelled'||!r.google_event_id;
 edit.onclick=()=>{editing=r.id;const form=$('form');for(const name of ['customer','phone','service','notes','duration_minutes'])form.elements[name].value=r[name];form.elements.sms_enabled.checked=Boolean(r.sms_enabled);const d=new Date(r.starts_at);const two=n=>String(n).padStart(2,'0');form.elements.starts_at.value=d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())+'T'+two(d.getHours())+':'+two(d.getMinutes());$('formtitle').textContent='Foglalás szerkesztése #'+r.id;$('save').textContent='Változások mentése';$('clear').hidden=false;form.scrollIntoView({behavior:'smooth'});};
 const cancel=document.createElement('button');cancel.textContent='Lemondás';cancel.className='danger';cancel.disabled=r.status==='cancelled';
 cancel.onclick=()=>api('/api/appointments/'+r.id+'/cancel','PATCH').then(refresh).catch(e=>message(e.message));
 a.append(h,p,detail,document.createElement('br'),edit,repeat,sms,print,tech,cancel);out.append(a);
 }}catch(e){message(e.message)}
}
$('refresh').onclick=refresh;
$('printerCheck').onclick=async()=>{try{const x=await api('/api/printer/status');message('Nyomtató: '+JSON.stringify(x))}catch(e){message(e.message)}};
document.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>{view=btn.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b===btn));refresh()});
let searchTimer; $('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(refresh,250)};
let customerTimer;
$('form').elements.customer.addEventListener('input',()=>{clearTimeout(customerTimer);customerTimer=setTimeout(suggestCustomers,300)});
async function suggestCustomers(){
 const value=$('form').elements.customer.value.trim(),box=$('suggestions');box.replaceChildren();
 if(value.length<2)return;
 try{const results=await api('/api/customers?search='+encodeURIComponent(value));
 for(const customer of results){const b=document.createElement('button');b.type='button';b.textContent=customer.customer+' · '+customer.phone+' ('+customer.visits+' korábbi foglalás)';
 b.onclick=()=>{$('form').elements.customer.value=customer.customer;$('form').elements.phone.value=customer.phone;box.replaceChildren()};box.append(b)}
 }catch(e){message(e.message)}
}
$('clear').onclick=()=>{editing=null;$('form').reset();$('formtitle').textContent='Új foglalás';$('save').textContent='Időpont mentése';$('clear').hidden=true;};
$('form').onsubmit=async e=>{
 e.preventDefault();const f=new FormData(e.target);const raw=f.get('starts_at');
 const d=new Date(raw);if(isNaN(d)){message('Érvénytelen időpont');return}
 const body={customer:f.get('customer'),phone:f.get('phone'),service:f.get('service'),starts_at:d.toISOString(),duration_minutes:Number(f.get('duration_minutes')),notes:f.get('notes'),sms_enabled:f.has('sms_enabled')};
 try{await api(editing?'/api/appointments/'+editing:'/api/appointments',editing?'PUT':'POST',body);$('clear').click();message('Foglalás és Google Calendar frissítve.');refresh()}catch(err){message(err.message)}
};
refresh();
</script></body></html>
