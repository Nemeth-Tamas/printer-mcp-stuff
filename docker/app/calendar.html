<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cellnet naptár</title>
<style>body{font-family:system-ui;background:#101827;color:#eaf1ff;max-width:1200px;margin:25px auto;padding:10px}a{color:#99c5ff}button{cursor:pointer;background:#315c98;color:white;padding:8px;border:0;border-radius:7px}.toolbar{display:flex;gap:15px;align-items:center}.week{display:grid;grid-template-columns:repeat(7,minmax(155px,1fr));gap:8px;overflow:auto}.day{background:#1b2b42;border-radius:10px;padding:12px;min-height:370px}.event{background:#244a60;padding:8px;margin:8px 0;border-left:3px solid #72d8ac;border-radius:5px;font-size:13px}.slot{display:block;margin:8px 0;background:#273950;font-size:12px;width:100%;text-align:left}@media(max-width:1100px){.week{grid-template-columns:repeat(7,170px)}}</style>
</head><body><h1>Cellnet – heti naptár</h1><a href="/">← Időpontfoglalás</a><div class="toolbar"><button id="back">← Előző</button><strong id="heading"></strong><button id="forward">Következő →</button><button id="today">Ma</button></div><p id="status"></p><div class="week" id="week"></div>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function monday(d){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
let start=monday(new Date());
async function draw(){let end=new Date(start);end.setDate(end.getDate()+7);$('heading').textContent=dateKey(start)+' – '+dateKey(new Date(end-86400000));let root=$('week');root.replaceChildren();try{let resp=await fetch('/api/calendar/week?start='+dateKey(start));if(!resp.ok)throw Error('HTTP '+resp.status);let data=await resp.json();$('status').textContent=data.google_connected?'Google Calendar + helyi foglalások':'Helyi foglalások (Google API még nincs beállítva)';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);let col=document.createElement('section');col.className='day';let h=document.createElement('h3');h.textContent=d.toLocaleDateString('hu-HU',{weekday:'short',month:'short',day:'numeric'});col.append(h);for(let ev of data.events.filter(e=>e.start.slice(0,10)===dateKey(d))){let div=document.createElement('div');div.className='event';div.textContent=ev.start.slice(11,16)+' '+ev.title;col.append(div)}for(let hour=8;hour<=18;hour++){let b=document.createElement('button');b.className='slot';b.textContent=pad(hour)+':00 + Foglalás';b.onclick=()=>location.href='/?slot='+dateKey(d)+'T'+pad(hour)+':00';col.append(b)}root.append(col)}}catch(e){$('status').textContent='Hiba: '+e.message}}
$('back').onclick=()=>{start.setDate(start.getDate()-7);draw()};$('forward').onclick=()=>{start.setDate(start.getDate()+7);draw()};$('today').onclick=()=>{start=monday(new Date());draw()};draw();
</script></body></html>
