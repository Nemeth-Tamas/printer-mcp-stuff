services:
  booking:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8088:8088"
    volumes:
      - booking_data:/data
      - /run/google:/run/google:ro
  sms-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.sms_worker"]
    volumes:
      - booking_data:/data
volumes:
  booking_data:
